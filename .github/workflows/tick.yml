name: Postlarni vaqtida chiqarish

# Toshkent vaqti UTC+5: 09:00 = 04:00 UTC, 19:00 = 14:00 UTC.
# GitHub scheduled ishlarni ba'zan kechiktiradi. Shu sabab chiqishdan 8 daqiqa
# oldin va keyingi bir soat davomida 5 daqiqalik zaxira tekshiruvlar bor.
# Har bir ish faqat bir marta tick qiladi; allaqachon chiqqan post takrorlanmaydi.
on:
  schedule:
    - cron: "52,57 3,13 * * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 4,14 * * *"
  workflow_dispatch:

concurrency:
  group: chiqarish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      - name: Kutish va chiqarish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main tick

      - name: Xato bo'lsa Telegramga xabar
        if: failure()
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          TEXT="⚠️ Immensus Post chiqarish workflow'i yiqildi.
          Loglar: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
            -d chat_id="${CHAT}" --data-urlencode text="${TEXT}" > /dev/null || true

      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "immensus-post-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "navbat yangilandi $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

