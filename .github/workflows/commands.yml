name: Buyruqlarni o'qish

# ============================================================
#  "Postlarni vaqtida chiqarish" 07:00, 13:00 va 19:00 atrofida ishlaydi.
#  Shu oraliqlardan tashqarida yozilgan /balans, /holat, /pauza
#  kabi buyruqlar keyingi kuzatuvgacha
#  javobsiz qolib ketardi.
#
#  Bu ish `tick` ni HECH QANDAY kutishsiz, bir marta chaqiradi —
#  faqat Telegram xabarlarini o'qib javob berish va (agar postning
#  chiqish vaqti allaqachon yetgan bo'lsa) uni chiqarish uchun.
#  Har soatda ishlaydi, bir necha soniyada tugaydi. Post chiqarish vaqtlarida
#  esa tick.yml alohida zaxira tekshiruvlarni bajaradi.
# ============================================================
on:
  schedule:
    # Soat boshidagi GitHub Actions tirbandligini chetlab o'tish uchun :17.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  # "Chiqarish (kuzatuvchi)" bilan BIR XIL guruh — shu ikkalasi hech qachon
  # bir vaqtda ishlamasin (aks holda ikkalasi ham "chiqadi" deb topib,
  # postni ikki marta yuborishi mumkin edi). Kuzatuvchi band bo'lsa, bu ish
  # navbatda kutadi va u tugagach darhol ishga tushadi.
  group: chiqarish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      - name: Buyruqlarni o'qish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main tick

      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name  "immensus-post-bot"
          git config user.email "autopost@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "buyruq/navbat $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

