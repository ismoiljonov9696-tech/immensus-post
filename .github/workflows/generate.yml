name: Postlarni tayyorlash

# Kuniga 1 post: 07:00 (Asia/Tashkent).
# 20:17 Toshkentda ertangi post oldindan tayyorlanadi.
# 05:17 dagi zaxira ish navbat bo'sh bo'lsa uni to'ldiradi.
# Daqiqalar ataylab :00 emas — GitHub Actions soat boshida ko'proq kechikadi.
on:
  schedule:
    - cron: "17 15 * * *"      # 20:17 Toshkent — ertangi post
    - cron: "17 0 * * *"       # 05:17 Toshkent — zaxira
  workflow_dispatch:
    inputs:
      count:
        description: "Nechta post tayyorlansin"
        type: string
        default: "1"
      force:
        description: "Sifat nazoratidan o'tmasa ham davom etsinmi"
        type: boolean
        default: false
      content_slot:
        description: "Namuna uchun kontent turi: 07:00 (ixtiyoriy)"
        type: string
        default: ""

concurrency:
  group: tayyorlash
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      - name: Postlarni tayyorlash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRON: ${{ github.event.schedule }}
          COUNT: ${{ inputs.count }}
          FORCE: ${{ inputs.force }}
          CONTENT_SLOT: ${{ inputs.content_slot }}
        run: |
          if [ "$CRON" = "17 15 * * *" ]; then
            FLAGS="--count 1"
            echo "Asosiy ish: ertangi 1 ta post tayyorlanadi"
          elif [ "$CRON" = "17 0 * * *" ]; then
            FLAGS="--top-up 1"
            echo "Zaxira ish: bo'sh navbat 1 taga to'ldiriladi"
          else
            FLAGS="--count ${COUNT:-1}"
            echo "Qo'lda ishga tushirildi"
          fi
          if [ "$FORCE" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          python -m src.main generate $FLAGS

      - name: Xato bo'lsa Telegramga xabar
        if: failure()
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          TEXT="⚠️ Immensus Post uchun post tayyorlashda GitHub Actions xatosi yuz berdi.
          Loglar: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
            -d chat_id="${CHAT}" --data-urlencode text="${TEXT}" > /dev/null || true

      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "immensus-post-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "postlar tayyorlandi $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

