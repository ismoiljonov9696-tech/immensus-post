name: Postlarni tayyorlash

# Kuniga 2 post: 09:00 va 19:00 (Asia/Tashkent).
# 20:00 Toshkentda ertangi ikki post oldindan tayyorlanadi.
# 08:00 dagi zaxira ish navbat yetishmasa uni 2 taga to'ldiradi.
on:
  schedule:
    - cron: "0 15 * * *"       # 20:00 Toshkent — ertangi 2 post
    - cron: "0 3 * * *"        # 08:00 Toshkent — zaxira
  workflow_dispatch:
    inputs:
      count:
        description: "Nechta post tayyorlansin"
        type: string
        default: "2"
      force:
        description: "Sifat nazoratidan o'tmasa ham davom etsinmi"
        type: boolean
        default: false

concurrency:
  group: tayyorlash
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      - name: Postlarni tayyorlash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRON: ${{ github.event.schedule }}
          COUNT: ${{ inputs.count }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$CRON" = "0 15 * * *" ]; then
            FLAGS="--count 2"
            echo "Asosiy ish: ertangi 2 ta post tayyorlanadi"
          elif [ "$CRON" = "0 3 * * *" ]; then
            FLAGS="--top-up 2"
            echo "Zaxira ish: navbat 2 taga to'ldiriladi"
          else
            FLAGS="--count ${COUNT:-2}"
            echo "Qo'lda ishga tushirildi"
          fi
          if [ "$FORCE" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          python -m src.main generate $FLAGS

      - name: Xato bo'lsa Telegramga xabar
        if: failure()
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          TEXT="⚠️ Immensus Post uchun post tayyorlashda GitHub Actions xatosi yuz berdi.
          Loglar: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
            -d chat_id="${CHAT}" --data-urlencode text="${TEXT}" > /dev/null || true

      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "immensus-post-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "postlar tayyorlandi $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

